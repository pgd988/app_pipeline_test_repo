name: Build and Push to ECR

on:
  push:
    branches:
      - '**'

env:
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::037613907583:role/GitHubActionsRole-app-pipeline"
  AWS_REGION: eu-north-1


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.short_sha }}
      database_changed: ${{ steps.filter.outputs.database }}
    # Required for OIDC authentication with AWS
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for database changes
        id: filter
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            DIFF_ARGS="${{ github.event.before }} ${{ github.sha }}"
          else
            DIFF_ARGS="HEAD~1 HEAD"
          fi
          
          if git diff --name-only $DIFF_ARGS 2>/dev/null | grep -q 'database/'; then
            echo "database=true" >> $GITHUB_OUTPUT
          elif git show --name-only ${{ github.sha }} | grep -q 'database/'; then
            echo "database=true" >> $GITHUB_OUTPUT
          else
            echo "database=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash and branch name
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # Replace slashes with dashes in branch name to be safe for docker tags
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr '/' '-')
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: develop/test-app
          IMAGE_NAME: test-app
          IMAGE_TAG: ${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.short_sha }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          # Build locally as test-app:<branch>_<sha> as requested
          DOCKER_BUILDKIT=0 docker build -t $IMAGE_NAME:$IMAGE_TAG .
          
          # Tag for ECR and push
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Tag and push migrations image to Amazon ECR
        if: steps.filter.outputs.database == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: develop/test-app-migrations
          IMAGE_NAME: test-app
          IMAGE_TAG: ${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.short_sha }}
        run: |
          # Tag for ECR and push migrations image
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-argocd:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only run the deployment job if this is the main branch
    if: github.ref == 'refs/heads/main'
    # Use the protected GitHub Environment for security
    environment: production_test
    steps:
      - name: Checkout ArgoCD repository
        uses: actions/checkout@v4
        with:
          repository: pgd988/argocd_test_repo
          # Use the SSH private key stored in the protected 'production' environment secrets
          ssh-key: ${{ secrets.ARGOCD_DEPLOY_KEY }}
          path: argocd-repo

      - name: Update image tag in kustomization.yaml
        run: |
          cd argocd-repo/CD/workloads/app-backend/v1
          # Use yq to update the newTag for the nginx image
          yq e '(.images[] | select(.name == "037613907583.dkr.ecr.eu-north-1.amazonaws.com/develop/test-app") | .newTag) = "${{ needs.build-and-push.outputs.image_tag }}"' -i kustomization.yaml
          
          if [ "${{ needs.build-and-push.outputs.database_changed }}" == "true" ]; then
            yq e '(.images[] | select(.name == "037613907583.dkr.ecr.eu-north-1.amazonaws.com/develop/test-app-migrations") | .newTag) = "${{ needs.build-and-push.outputs.image_tag }}"' -i kustomization.yaml
          fi
          
      - name: Commit and push changes
        run: |
          cd argocd-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CD/workloads/app-backend/v1/kustomization.yaml
          
          COMMIT_MSG="Update app image tag to ${{ needs.build-and-push.outputs.image_tag }}"
          if [ "${{ needs.build-and-push.outputs.database_changed }}" == "true" ]; then
            COMMIT_MSG="Update app and migrations image tags to ${{ needs.build-and-push.outputs.image_tag }}"
          fi
          
          if ! git diff --staged --quiet; then
            git commit -m "$COMMIT_MSG"
            # Force git to use SSH instead of HTTPS
            git remote set-url origin git@github.com:pgd988/argocd_test_repo.git
            git push origin main
          else
            echo "No changes to commit."
          fi
